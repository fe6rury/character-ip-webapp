<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐릭터 IP 유사도 판별</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#15181d; --muted:#6b7280;
    --line:#e3e6ea; --accent:#2563eb; --danger:#dc2626; --ok:#059669;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1115; --card:#171a20; --ink:#e8eaed; --muted:#9aa3af;
      --line:#272b33; --accent:#60a5fa; --danger:#f87171; --ok:#34d399;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:980px; margin:0 auto; padding:32px 16px 72px}
  header .badge{
    display:inline-block; font-size:12px; font-weight:700; letter-spacing:.02em;
    color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
    padding:3px 10px; border-radius:99px; margin-bottom:10px;
  }
  header h1{font-size:22px; margin:0 0 4px}
  header p{margin:0 0 24px; color:var(--muted); font-size:14px}

  .card{background:var(--card); border:1px solid var(--line);
        border-radius:var(--radius); padding:20px; margin-bottom:20px}

  #drop{
    border:2px dashed var(--line); border-radius:var(--radius);
    padding:40px 20px; text-align:center; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  #drop:hover,#drop.over{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 6%,transparent)}
  #drop strong{display:block; font-size:15px; margin-bottom:4px}
  #drop span{color:var(--muted); font-size:13px}
  #file{display:none}

  .row{display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start}
  .qbox{width:200px; flex:0 0 200px}
  .preview{position:relative; overflow:hidden; border-radius:10px; background:#fff}
  .preview img{display:block; width:100%; height:auto}
  .detection{position:absolute; border:2px solid #4ade80; pointer-events:none}
  .detection b{position:absolute; inset:0 auto auto 0; background:#166534; color:#fff;
               font-size:11px; padding:0 3px}
  .table-scroll{overflow:auto}
  .qbox .cap{font-size:12px; color:var(--muted); margin-top:6px; word-break:break-all}
  .res{flex:1 1 380px; min-width:280px}

  .banner{padding:12px 14px; border-radius:10px; font-size:14px; font-weight:600; margin-bottom:14px}
  .banner.hit{background:color-mix(in srgb,var(--danger) 12%,transparent); color:var(--danger)}
  .banner.clear{background:color-mix(in srgb,var(--ok) 12%,transparent); color:var(--ok)}

  table{width:100%; border-collapse:collapse; font-size:14px}
  th,td{padding:10px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle}
  th{font-size:12px; color:var(--muted); font-weight:600; white-space:nowrap}
  td.num{font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
  tr.flagged td{background:color-mix(in srgb,var(--danger) 7%,transparent)}
  .thumb{width:52px; height:52px; object-fit:contain; background:#fff;
         border:1px solid var(--line); border-radius:8px}
  .score{font-weight:700}
  .bar{height:5px; border-radius:3px; background:var(--line); margin-top:4px; overflow:hidden}
  .bar i{display:block; height:100%; background:var(--accent)}
  tr.flagged .bar i{background:var(--danger)}
  .bar i.c{background:var(--muted) !important}
  .tag{font-size:12px; padding:3px 8px; border-radius:99px; white-space:nowrap}
  .tag.hit{background:var(--danger); color:#fff}
  .tag.ok{background:var(--line); color:var(--muted)}

  footer{margin-top:28px; font-size:12px; color:var(--muted)}
  footer code{background:var(--line); padding:1px 5px; border-radius:4px}
  .spin{display:inline-block; width:14px; height:14px; border:2px solid var(--line);
        border-top-color:var(--accent); border-radius:50%; animation:r .7s linear infinite;
        vertical-align:-2px; margin-right:8px}
  @keyframes r{to{transform:rotate(360deg)}}
  .err{color:var(--danger); font-size:14px}
  @media (max-width:600px){ .qbox{flex:1 1 100%; width:100%} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>캐릭터 IP 유사도 판별</h1>
    <p>상품 사진에서 캐릭터 인쇄 영역을 찾고, 등록된 공공 마스코트 10종과 비교합니다.</p>
  </header>

  <div class="card">
    <div id="drop">
      <strong>이미지를 끌어다 놓거나 클릭해서 선택</strong>
      <span>PNG · JPG · WEBP · 최대 20 MB</span>
    </div>
    <input id="file" type="file" accept="image/*">
  </div>

  <div class="card" id="out" hidden></div>

  <footer>
    학습 모델의 판별 점수가 <code id="thr">—</code> 이상이면 사람이 검토할 후보로 표시됩니다.
  </footer>

</div>

<script>
const drop = document.getElementById('drop');
const file = document.getElementById('file');
const out = document.getElementById('out');
let requestNumber = 0;
let previewUrl;


drop.addEventListener('click', () => file.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files.length) send(e.dataTransfer.files[0]);
});
file.addEventListener('change', () => { if (file.files.length) send(file.files[0]); });

fetch('/health').then(r => r.json())
  .then(d => { document.getElementById('thr').textContent = d.threshold.toFixed(3); })
  .catch(() => {});

function esc(s){ return String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// 0.6~1.0 구간을 막대 길이 0~100%로 환산 (실제 값이 그 범위에서만 움직임)
function pct(v){ return Math.max(0, Math.min(100, (v - 0.6) / 0.4 * 100)); }

async function send(f){
  const current = ++requestNumber;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = null;
  out.hidden = false;
  out.innerHTML = '<span class="spin"></span>분석 중…';

  const fd = new FormData();
  fd.append('file', f);

  let data;
  try {
    const res = await fetch('/api/identify', { method:'POST', body: fd });
    if (current !== requestNumber) return;
    if (!res.ok) {
      const t = await res.text();
      out.innerHTML = '<p class="err">오류 ' + res.status + ' — ' + esc(t) + '</p>';
      return;
    }
    data = await res.json();
  } catch (e) {
    if (current !== requestNumber) return;
    out.innerHTML = '<p class="err">서버에 연결하지 못했습니다. ' + esc(e.message) + '</p>';
    return;
  }

  if (current !== requestNumber) return;
  previewUrl = URL.createObjectURL(f);
  const boxes = data.detections.map(({box: [x1, y1, x2, y2]}, i) => `
    <span class="detection" style="left:${x1*100}%;top:${y1*100}%;width:${(x2-x1)*100}%;height:${(y2-y1)*100}%">
      <b>${i+1}</b>
    </span>`).join('');
  const detectionNote = data.detections.length
    ? `YOLO 인쇄 영역 ${data.detections.length}개`
    : '인쇄 영역 미검출 · 전체 이미지 검색';
  const rows = data.results.map(r => `
    <tr class="${r.flagged ? 'flagged' : ''}">
      <td class="num">${r.rank}</td>
      <td><img class="thumb" src="${r.best_origin_url}" alt=""></td>
      <td>
        ${esc(r.character)}
        <div style="font-size:12px;color:var(--muted)">${esc(r.best_origin)} ·
          ${esc(r.comparison_source)}${r.detection_index === null ? '' : ' ' + (r.detection_index + 1)}</div>
      </td>
      <td class="num"><span class="score">${r.recognition_score.toFixed(4)}</span></td>
      <td class="num">
        <span>${r.max_similarity.toFixed(4)}</span>
        <div class="bar"><i style="width:${pct(r.max_similarity)}%"></i></div>
      </td>
      <td class="num">
        <span style="color:var(--muted)">${r.color_similarity.toFixed(4)}</span>
        <div class="bar"><i class="c" style="width:${r.color_similarity*100}%"></i></div>
      </td>
      <td>
        <span class="tag ${r.flagged ? 'hit' : 'ok'}">${esc(r.verdict)}</span>
        ${r.color_note && r.color_note !== '—'
          ? `<div style="font-size:11px;color:var(--muted);margin-top:4px">${esc(r.color_note)}</div>`
          : ''}
      </td>
    </tr>`).join('');

  out.innerHTML = `
    <div class="row">
      <div class="qbox">
        <div class="preview"><img src="${previewUrl}" alt="입력 이미지">${boxes}</div>
        <div class="cap">${esc(detectionNote)}</div>
        <div class="cap">${esc(data.filename || '')}</div>
      </div>
      <div class="res">
        <div class="banner ${data.flagged ? 'hit' : 'clear'}">${esc(data.summary)}</div>
        <div class="table-scroll"><table>
          <thead><tr>
            <th>#</th><th>원본</th><th>캐릭터</th>
            <th style="text-align:right">판별 점수</th>
            <th style="text-align:right">형태 유사도</th>
            <th style="text-align:right">색상 유사도</th>
            <th>판정</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      </div>
    </div>`;
}
</script>
</body>
</html>
